name: tree
version: 0.1.0
synopsis: Phylogenetic trees as a recursive sum type, parsed and printed in C++
description: >
  A rooted tree is `Leaf l | Node n [(e, RootedTree n e l)]`, so every child
  carries the edge that reaches it -- which is where a phylogeny keeps its
  branch lengths. C++ owns the Newick parser and printer against its own
  template for that type; morloc owns the two shape statistics, written as
  recursive functions over the constructors that work for any labelling.
category: tutorial
license: MIT
author: "Zebulun Arendsee"
maintainer: "z@morloc.io"
dependencies: []
